[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"
  NPM_FLAGS = "--legacy-peer-deps"

# SPA fallback — required because the app uses react-router's
# createBrowserRouter (client-side routing). Without this, any route
# other than "/" returns nothing on Netlify → blank screen.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "unsafe-none"
    Cross-Origin-Embedder-Policy = "unsafe-none"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
